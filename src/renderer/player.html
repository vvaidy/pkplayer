<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'">
  <title>PK Player — Presenting</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="player.css">
  <script type="module" src="player.js"></script>
</head>
<body class="player">
  <div id="stage" class="stage"></div>

  <div id="progress" class="progress" hidden><div id="progressFill" class="progress-fill"></div></div>
  <div id="counter" class="counter" hidden></div>
  <div id="pauseBadge" class="pause-badge" hidden><span></span><span></span></div>

  <div id="waiting" class="waiting" hidden>
    <button id="bigPlay" class="big-play" aria-label="Play"><span class="tri"></span></button>
    <div id="deckLabel" class="deck-label"></div>
    <div class="hint">Space or click to start · N skip PDF · Esc exit</div>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div id="loadingText">Loading slides…</div>
  </div>

  <div id="ended" class="ended" hidden>
    <div class="ended-title">End of event</div>
    <div class="hint">Press Esc to return to the editor</div>
  </div>

  <div id="flash" class="flash" hidden></div>
</body>
</html>
